syntax = "proto3";

option java_multiple_files = true;
option java_package = "yasc";
option java_outer_classname = "YascProto";

package yasc;

service Yasc {
  rpc SetScriptServerPort (SetScriptServerPortRequest) returns (SetScriptServerPortReply) {}
  rpc SetScriptsDir (SetScriptsDirRequest) returns (SetScriptsDirReply) {}

  rpc SendParsedHttpRequest (ParsedHttpRequest) returns (RawHttpResponse) {}
  rpc SendRawHttpRequest (RawHttpRequest) returns (RawHttpResponse) {}
  rpc FetchSmtpMessages (FetchSmtpMessagesRequest) returns (FetchSmtpMessagesResponse) {}
}

enum HttpMethod {
  GET = 0;
  POST = 1;
  PUT = 2;
  DELETE = 3;
  PATCH = 4;
}

message HttpHeader{
  string name = 1;
  string value = 2;
}

message HttpCookie{
  string name = 1;
  string value = 2;
}

message ParsedHttpRequest {
  string url = 1;
  HttpMethod method = 2;
  repeated HttpHeader headers = 3;
  string body = 4;
  optional bool needsResponse = 5;
}

message RawHttpRequest {
  string baseUrl = 1;
  bytes request = 2;
  optional bool needsResponse = 3;
}

message RawHttpResponse {
  optional bytes response = 1;
}

message FetchSmtpMessagesRequest {
  int32 index = 1;
}

message FetchSmtpMessagesResponse {
  repeated string conversations = 1;
}

message SetScriptServerPortRequest {
  int32 port = 1;
}

message SetScriptServerPortReply {
  optional bool success = 1;
}

message SetScriptsDirRequest {
  string scriptsDir = 1;
}

message SetScriptsDirReply {
  optional bool success = 1;
}
